<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a4b">
<title>Seriali CDPTR</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{
  --bg:#121715; --surface:#1b2220; --fg:#e7ecea; --muted:#9aa8a2; --line:#2e3834;
  --accent:#3fbf86; --accent-fg:#06140e; --warn:#f0b459; --err:#f2a39c; --err-bg:#341a18;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Roboto Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left));display:grid;gap:14px}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:13px}
.cam{position:relative;width:100%;aspect-ratio:3/4;max-height:62vh;background:#000;border-radius:12px;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;left:8%;right:8%;top:42%;height:16%;border:3px solid var(--accent);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.guide.ok{border-color:#fff;box-shadow:0 0 0 9999px rgba(11,122,75,.45)}
.hint{position:absolute;left:0;right:0;top:calc(42% - 34px);text-align:center;font-size:14px;color:#fff;text-shadow:0 1px 3px #000}
.camover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#fff;font-size:15px}
.live{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--mono);font-size:13px;color:#ddd;text-shadow:0 1px 3px #000}
button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:12px 14px;min-height:50px;cursor:pointer}
button:disabled{opacity:.45}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 130px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
#sn{font-family:var(--mono);font-size:32px;font-weight:700;text-align:center;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#sn.bad{border-color:var(--err);background:var(--err-bg)}
.note{font-size:14px;min-height:1.2em}
.note.err{color:var(--err)}.note.warn{color:var(--warn)}.note.ok{color:var(--accent)}
h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:baseline}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:2em 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.idx{color:var(--muted);font-size:13px;text-align:right}
.serial{font-family:var(--mono);font-size:18px;font-weight:700;overflow-wrap:anywhere}
.del{min-height:38px;padding:4px 10px;font-weight:400;color:var(--err)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],select{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
details summary{color:var(--muted);font-size:14px;cursor:pointer}
details .g{display:grid;gap:10px;margin-top:10px}
.confirm{border:1px solid var(--err);background:var(--err-bg);border-radius:10px;padding:12px;display:grid;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Seriali CDPTR</h1>
    <div class="sub">Intersys · Centralina Luce Emergenza</div>
  </div>

  <div class="cam">
    <video id="video" playsinline muted></video>
    <div class="hint" id="hint" hidden>Metti la riga "S/N" dentro il riquadro</div>
    <div class="guide" id="guide" hidden></div>
    <div class="live" id="live"></div>
    <div class="camover" id="camover"><button class="primary" id="startBtn">Avvia fotocamera</button></div>
  </div>
  <div class="row">
    <button id="torchBtn" hidden>Torcia</button>
    <button id="pauseBtn" hidden>Pausa</button>
  </div>

  <div class="panel">
    <input type="text" id="sn" placeholder="—" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Seriale">
    <div class="note" id="msg"></div>
    <div class="row">
      <button class="primary" id="saveBtn">Salva seriale</button>
      <button id="againBtn">Rileggi</button>
    </div>
  </div>

  <div class="panel">
    <div class="head"><h2>Seriali letti</h2><span class="sub" id="count">0 pezzi</span></div>
    <ol id="list"></ol>
    <div class="sub" id="empty">Nessun seriale ancora.</div>
  </div>

  <div class="panel">
    <h2>Esporta</h2>
    <div class="row">
      <button class="primary" id="expPt">CSV per P-touch</button>
      <button id="expFull">CSV tracciamento</button>
    </div>
    <div class="note" id="expMsg"></div>
    <details>
      <summary>Impostazioni CSV</summary>
      <div class="g">
        <label>Nome colonna seriale (come nel modello P-touch)<input type="text" id="colName" value="Seriale"></label>
        <label>Separatore<select id="sep"><option value=";">Punto e virgola ( ; ) — Excel italiano</option><option value=",">Virgola ( , )</option></select></label>
        <label><span><input type="checkbox" id="header" checked> Includi riga di intestazione</span></label>
      </div>
    </details>
    <button id="resetBtn">Svuota lista</button>
    <div class="confirm" id="confirmBox" hidden>
      <span>Cancellare tutti i <b id="confirmN">0</b> seriali? Esporta prima il CSV se ti serve.</span>
      <div class="row"><button id="confirmYes" style="background:#b3261e;border-color:#b3261e;color:#fff">Sì, svuota</button><button id="confirmNo">No</button></div>
    </div>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const KEY="cdptr-seriali-v1", SET="cdptr-settings-v1";
  let items=[], worker=null, stream=null, track=null, running=false, busy=false, last="", hits=0, torch=false;

  // ---------- dati ----------
  function load(){try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){items=[]}
    try{const s=JSON.parse(localStorage.getItem(SET));if(s){$("colName").value=s.col||"Seriale";$("sep").value=s.sep||";";$("header").checked=s.header!==false}}catch(e){}}
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
  const persistSet=()=>{try{localStorage.setItem(SET,JSON.stringify({col:$("colName").value,sep:$("sep").value,header:$("header").checked}))}catch(e){}};

  // Solo cifre con "/" opzionale; corregge lettere scambiate per cifre
  function normalize(raw){
    let s=String(raw||"").toUpperCase().replace(/^\s*S\s*[\/\\]?\s*N[\s:.\-]*/,"");
    s=s.replace(/[\\|]/g,"/").replace(/\s+/g,"");
    return s.replace(/[OQD]/g,"0").replace(/[IL!]/g,"1").replace(/S/g,"5").replace(/B/g,"8").replace(/Z/g,"2").replace(/G/g,"6");
  }
  const valid=s=>/^\d+(\/\d+)?$/.test(s);

  // Dal testo letto nel riquadro estrae il seriale dopo "S/N"
  function extract(text){
    const t=text.toUpperCase().replace(/\n/g," ");
    let m=t.match(/S\s*[\/\\|1I]?\s*N\s*[:.]?\s*([0-9OIL]+(?:\s*[\/\\|]\s*[0-9OIL]+)?)/);
    if(!m) m=t.match(/\b([0-9]{1,8}\s*\/\s*[0-9]{1,8})\b/);
    if(!m) return "";
    const v=normalize(m[1]);
    return valid(v)?v:"";
  }

  function note(el,text,kind){el.textContent=text||"";el.className="note "+(kind||"")}

  function render(){
    const ol=$("list");ol.textContent="";
    $("count").textContent=items.length+(items.length===1?" pezzo":" pezzi");
    $("empty").hidden=items.length>0;
    for(let i=items.length-1;i>=0;i--){
      const it=items[i],li=document.createElement("li");
      const n=document.createElement("span");n.className="idx";n.textContent=i+1;
      const s=document.createElement("span");s.className="serial";s.textContent=it.sn;
      const d=document.createElement("button");d.className="del";d.textContent="Elimina";
      d.onclick=()=>{items.splice(i,1);persist();render()};
      li.append(n,s,d);ol.appendChild(li);
    }
  }

  function checkInput(){
    const raw=$("sn").value.trim(); if(!raw){$("sn").classList.remove("bad");note($("msg"),"");return null}
    const v=normalize(raw);
    if(!valid(v)){$("sn").classList.add("bad");note($("msg"),"Formato non valido: solo cifre, con eventuale \"/\" (es. 160/14 o 1602).","err");return null}
    $("sn").classList.remove("bad");
    if(items.some(x=>x.sn===v)) note($("msg"),"Attenzione: "+v+" è già nella lista.","warn"); else note($("msg"),"Controlla che corrisponda all'etichetta e salva.","ok");
    return v;
  }
  $("sn").addEventListener("input",()=>{checkInput();pauseScan()});
  $("sn").addEventListener("keydown",e=>{if(e.key==="Enter")save()});

  function save(){
    const v=checkInput(); if(!v){ if(!$("sn").value.trim()) note($("msg"),"Inquadra un'etichetta o scrivi il seriale.","err"); return }
    items.push({sn:v,t:Date.now()});persist();render();
    $("sn").value="";note($("msg"),"Salvato "+v+". Inquadra la prossima etichetta.","ok");
    resumeScan();
  }
  $("saveBtn").onclick=save;
  $("againBtn").onclick=()=>{$("sn").value="";note($("msg"),"");resumeScan()};

  // ---------- fotocamera + OCR ----------
  async function start(){
    $("camover").innerHTML="<span>Avvio fotocamera…</span>";
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
    }catch(e){
      $("camover").innerHTML="<span>Fotocamera non disponibile. Consenti l'accesso alla fotocamera per questo sito nelle impostazioni del browser e ricarica la pagina. La pagina deve essere aperta da un indirizzo https.</span>";
      return;
    }
    const v=$("video");v.srcObject=stream;await v.play();
    track=stream.getVideoTracks()[0];
    try{const c=track.getCapabilities?track.getCapabilities():{};if(c.torch)$("torchBtn").hidden=false;
      if(c.focusMode&&c.focusMode.includes("continuous")) await track.applyConstraints({advanced:[{focusMode:"continuous"}]});}catch(e){}
    $("camover").innerHTML="<span>Preparo la lettura del testo… (solo la prima volta richiede qualche secondo)</span>";
    try{
      worker=await Tesseract.createWorker("eng",1);
      await worker.setParameters({tessedit_char_whitelist:"0123456789/SN ",tessedit_pageseg_mode:"7"});
    }catch(e){
      $("camover").innerHTML="<span>Lettura del testo non disponibile: serve la connessione internet al primo avvio. Puoi comunque scrivere il seriale a mano.</span>";
      return;
    }
    $("camover").hidden=true;$("guide").hidden=false;$("hint").hidden=false;$("pauseBtn").hidden=false;
    running=true;loop();
  }
  $("startBtn").onclick=start;

  const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});

  function grabGuide(){
    const v=$("video"),cam=$("video").getBoundingClientRect(),g=$("guide").getBoundingClientRect();
    const vw=v.videoWidth,vh=v.videoHeight; if(!vw) return null;
    // object-fit:cover -> mappa coordinate schermo su coordinate video
    const scale=Math.max(cam.width/vw,cam.height/vh);
    const ox=(cam.width-vw*scale)/2, oy=(cam.height-vh*scale)/2;
    const sx=(g.left-cam.left-ox)/scale, sy=(g.top-cam.top-oy)/scale, sw=g.width/scale, sh=g.height/scale;
    const k=Math.min(3,1200/sw);
    canvas.width=Math.round(sw*k);canvas.height=Math.round(sh*k);
    ctx.drawImage(v,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
    // scala di grigi + contrasto
    const img=ctx.getImageData(0,0,canvas.width,canvas.height),d=img.data;
    let sum=0;for(let i=0;i<d.length;i+=4){const y=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=y;sum+=y}
    const mean=sum/(d.length/4);
    for(let i=0;i<d.length;i+=4){const y=d[i]>mean*0.82?255:0;d[i]=d[i+1]=d[i+2]=y}
    ctx.putImageData(img,0,0);
    return canvas;
  }

  async function loop(){
    while(running){
      if(!busy){
        busy=true;
        try{
          const c=grabGuide();
          if(c){
            const {data}=await worker.recognize(c);
            const raw=(data.text||"").trim();
            $("live").textContent=raw?("letto: "+raw.replace(/\s+/g," ")):"";
            const v=extract(raw);
            if(v){ if(v===last) hits++; else {last=v;hits=1}
              if(hits>=2){ found(v); }
            }
          }
        }catch(e){}
        busy=false;
      }
      await new Promise(r=>setTimeout(r,250));
    }
  }

  function found(v){
    $("sn").value=v;checkInput();
    $("guide").classList.add("ok");
    try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
    pauseScan();
  }
  function pauseScan(){ if(!worker) return; running=false;$("pauseBtn").textContent="Riprendi";$("hint").textContent="Lettura in pausa" }
  function resumeScan(){
    if(!worker) return; last="";hits=0;$("guide").classList.remove("ok");$("live").textContent="";
    $("hint").textContent="Metti la riga \"S/N\" dentro il riquadro";$("pauseBtn").textContent="Pausa";
    if(!running){running=true;loop()}
  }
  $("pauseBtn").onclick=()=>running?pauseScan():resumeScan();
  $("torchBtn").onclick=async()=>{torch=!torch;try{await track.applyConstraints({advanced:[{torch}]})}catch(e){}};

  // ---------- export ----------
  function csv(full){
    const sep=$("sep").value,col=$("colName").value.trim()||"Seriale";
    const q=s=>/["\n;,]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;const L=[];
    if(full){L.push(["N",col,"Data","Ora"].join(sep));items.forEach((it,i)=>{const d=new Date(it.t);L.push([i+1,q(it.sn),d.toLocaleDateString("it-IT"),d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})].join(sep))})}
    else{if($("header").checked)L.push(q(col));items.forEach(it=>L.push(q(it.sn)))}
    return L.join("\r\n")+"\r\n";
  }
  async function exp(full){
    if(!items.length){note($("expMsg"),"La lista è vuota.","err");return}
    const name=full?"CDPTR_tracciamento_"+new Date().toISOString().slice(0,10)+".csv":"CDPTR.csv";
    const file=new File(["﻿"+csv(full)],name,{type:"text/csv"});
    // Su telefono prova la condivisione (mail, Drive, WhatsApp...), altrimenti scarica
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); note($("expMsg"),"Inviato "+name+".","ok"); return } }
    catch(e){ if(e&&e.name==="AbortError"){note($("expMsg"),"Invio annullato.");return} }
    const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
    note($("expMsg"),"Scaricato "+name+" ("+items.length+" seriali).","ok");
  }
  $("expPt").onclick=()=>exp(false);
  $("expFull").onclick=()=>exp(true);
  ["colName","sep","header"].forEach(id=>$(id).addEventListener("change",persistSet));
  $("resetBtn").onclick=()=>{if(!items.length)return;$("confirmN").textContent=items.length;$("confirmBox").hidden=false};
  $("confirmNo").onclick=()=>$("confirmBox").hidden=true;
  $("confirmYes").onclick=()=>{items=[];persist();render();$("confirmBox").hidden=true;note($("expMsg"),"Lista svuotata.")};

  load();render();
})();
</script>
</body>
</html>
